name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.321'
      - name: Show installed SDKs
        run: dotnet --info
      - name: Build the solution
        run: dotnet build csharp-flow-viewer.sln --configuration Release
      - name: Run all tests, including MSBuild integration
        run: dotnet test tests/Flow.Tests/Flow.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal" --results-directory TestResults
      - name: Build the Razor sample
        run: dotnet build samples/OrderProcessing/OrderProcessing.csproj --configuration Release
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
