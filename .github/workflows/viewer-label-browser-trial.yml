name: Viewer label browser verification
on:
  push:
    branches: [codex/viewer-label-render-test]
permissions:
  contents: read
jobs:
  browser:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Verify Mermaid and reduced layout in Chromium
        shell: pwsh
        run: |
          $env:CFV_MERMAID_FIXTURE = Join-Path $env:RUNNER_TEMP 'cfv-mermaid.mmd'
          dotnet test tests/Flow.Tests/Flow.Tests.csproj --configuration Release --filter 'FullyQualifiedName~Mermaid'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix tools/preview ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/preview/node_modules/playwright-core/cli.js install chromium --only-shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          p = Path("src/Flow.Desktop/Preview/preview.js")
          s = p.read_text(encoding="utf-8")
          s = s.replace('    } catch {\n      if (request !== generation) return;', '    } catch (error) {\n      console.error(error.stack || error.message);\n      if (request !== generation) return;', 1)
          p.write_text(s, encoding="utf-8")
          p = Path("tools/preview/test.mjs")
          s = p.read_text(encoding="utf-8")
          s = s.replace('  await page.addInitScript(() => {', '  page.on("console", message => console.log("browser:", message.text()));\n  page.on("pageerror", error => console.log("pageerror:", error.stack));\n  await page.addInitScript(() => {', 1)
          s = s.replace('  await page.waitForFunction(() => window.previewMessages.some(message => message.type === "rendered"));', '  await page.waitForFunction(() => window.previewMessages.some(message => message.type === "rendered" || message.type === "error"));\n  assert.equal(await page.locator("#feedback").textContent(), "");', 1)
          p.write_text(s, encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix tools/preview test
