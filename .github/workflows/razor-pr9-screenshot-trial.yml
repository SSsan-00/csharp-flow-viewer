name: Razor PR 9 Windows verification
on:
  push:
    branches: [codex/razor-pr9-screen-trial]
permissions:
  contents: read
jobs:
  trial:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish the release EXE
        shell: pwsh
        run: |
          @'
          @page
          @{
              var quantity = 2;
          }
          @if (quantity > 1)
          {
              <p>Bulk order</p>
          }
          else
          {
              <p>Single item</p>
          }
          @for (var i = 0; i < quantity; i++)
          {
              <p>Line @i</p>
          }
          '@ | Set-Content 'samples/OrderProcessing/Pages/RazorBranchDemo.cshtml' -Encoding utf8
          dotnet restore samples/OrderProcessing/OrderProcessing.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Sample restore failed' }
          dotnet publish src/Flow.Desktop -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          Get-Item artifacts/win-x64/csharp-flow-viewer.exe | Select-Object Name,Length
      - name: Open the sample and capture the published application
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing,UIAutomationClient,UIAutomationTypes
          $ae = [System.Windows.Automation.AutomationElement]
          $c = [System.Windows.Automation.TreeScope]
          $dest = Join-Path $PWD 'artifacts/screenshot'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $p = Start-Process (Resolve-Path 'artifacts/win-x64/csharp-flow-viewer.exe') -PassThru
          Write-Host "Runner interactive=$([Environment]::UserInteractive), runner session=$((Get-Process -Id $PID).SessionId), app session=$($p.SessionId)"
          function Wait-Until([scriptblock]$f, [string]$why) {
            for ($i=0; $i -lt 60; $i++) {
              $result = & $f
              if ($result) { return $result }
              Start-Sleep -Milliseconds 500
            }
            throw "Timed out: $why"
          }
          function Find-Id($root, [string]$id) {
            $condition = [System.Windows.Automation.PropertyCondition]::new($ae::AutomationIdProperty,$id)
            return $root.FindFirst($c::Descendants,$condition)
          }
          function Select-ByText($root, [string]$pattern) {
            $items = $root.FindAll($c::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
            foreach ($item in $items) {
              if ($item.Current.ControlType -eq [System.Windows.Automation.ControlType]::ListItem -and $item.Current.Name -match $pattern) {
                $item.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
                return $true
              }
            }
            return $false
          }
          try {
            [void](Wait-Until { $p.Refresh(); if (!$p.HasExited -and $p.MainWindowHandle -ne 0) { $true } } 'EXE window')
            $win = $ae::FromHandle($p.MainWindowHandle)
            $wp = $win.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern)
            if ($wp.Current.CanMaximize) { $wp.SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Maximized) }
            $ws = New-Object -ComObject WScript.Shell
            if (!$ws.AppActivate($p.Id)) { throw 'Could not activate the WPF app' }
            $button = Wait-Until { Find-Id $win 'OpenButton' } 'Open project button'
            $button.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Start-Sleep -Seconds 2
            $file = (Resolve-Path 'samples/OrderProcessing/OrderProcessing.csproj').Path
            [System.Windows.Forms.SendKeys]::SendWait($file)
            [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
            [void](Wait-Until { $list = Find-Id $win 'FilesBox'; if ($list) { Select-ByText $list 'RazorBranchDemo[.]cshtml' } } 'RazorBranchDemo.cshtml in sample')
            [void](Wait-Until { $b = Find-Id $win 'FitButton'; if ($b -and $b.Current.IsEnabled) { $b } } 'graph fit button')
            (Find-Id $win 'FitButton').GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            [System.Windows.Forms.Cursor]::Position = [System.Drawing.Point]::new(4,4)
            Start-Sleep -Seconds 2
            $rect = $win.Current.BoundingRectangle
            if ($rect.Width -lt 640 -or $rect.Height -lt 420) { throw "Desktop capture size is too small: $rect" }
            $bmp = [System.Drawing.Bitmap]::new([int]$rect.Width,[int]$rect.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            try {
              $g.CopyFromScreen([int]$rect.X,[int]$rect.Y,0,0,$bmp.Size)
              $bmp.Save((Join-Path $dest 'razor-branches-pr9.png'),[System.Drawing.Imaging.ImageFormat]::Png)
            } finally { $g.Dispose(); $bmp.Dispose() }
          } finally { if (!$p.HasExited) { Stop-Process -Id $p.Id -ErrorAction SilentlyContinue } }
      - uses: actions/upload-artifact@v4
        with:
          name: razor-branches-pr9-screen
          path: artifacts/screenshot/razor-branches-pr9.png
          if-no-files-found: error
          retention-days: 7
