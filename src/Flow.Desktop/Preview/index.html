<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="preview.css">
  <script src="mermaid.bundle.js" defer></script>
  <script src="large-diagram.js" defer></script>
  <script src="preview.js" defer></script>
</head>
<body data-theme="dark">
  <main id="viewport" aria-label="制御フロー図" tabindex="0">
    <div id="graph"></div>
    <div id="feedback" role="status"></div>
    <div id="vertical-scroll" tabindex="0" aria-label="図を上下にスクロール" hidden><div></div></div>
    <form id="preview-search" role="search" hidden>
      <input type="search" aria-label="ノードを検索" placeholder="ノードを検索">
      <output aria-live="polite"></output>
      <button type="button" data-step="-1" aria-label="前の一致">↑</button>
      <button type="submit" aria-label="次の一致">↓</button>
      <button type="button" data-close aria-label="検索を閉じる">×</button>
    </form>
    <div id="node-menu" role="menu" aria-label="ノードの操作" hidden>
      <button type="button" role="menuitem" data-action="mark">マーク</button>
      <button type="button" role="menuitem" data-action="gray">グレーアウト</button>
      <button type="button" role="menuitem" data-action="clear">解除</button>
    </div>
  </main>
</body>
</html>
